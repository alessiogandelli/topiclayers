[tool.poetry]
name = "topiclayers"
version = "0.1.0"
description = "From any collection of posts to topical multilayer networks — hardened and social-scientist-friendly"
authors = ["alessiogandelli <alessiogandelli99@gmail.com>"]
readme = "README.md"
packages = [{include = "topiclayers", from = "src"}]
license = "MIT"
keywords = ["topic-modeling", "network-analysis", "social-science", "polarisation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
jsonlines = "^4.0.0"
pandas = ">=2.2,<4"
numpy = ">=1.26,<3"
sentence-transformers = "^6.0.0"
bertopic = "^0.17.4"
scikit-learn = ">=1.5"
umap-learn = "^0.5.12"
networkx = "^3.6"
igraph = ">=0.11.4"
uunet = "^2.1.1"
qdrant-client = "^1.19.0"
openai = "^3.0.0"
python-dotenv = "^1.0.1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=6.0"
jupyter = "^1.0.0"

[tool.poetry.scripts]
topiclayers = "topiclayers.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
