[tool.poetry]
name = "topiclayers"
version = "0.1.0"
description = "From any collection of posts to topical multilayer networks — hardened and social-scientist-friendly"
authors = ["alessiogandelli <alessiogandelli99@gmail.com>"]
readme = "README.md"
packages = [{include = "topiclayers", from = "src"}]
license = "MIT"
keywords = ["topic-modeling", "network-analysis", "social-science", "polarisation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
jsonlines = "^4.0.0"
pandas = "^2.0"
numpy = "^1.24"
sentence-transformers = "^2.6.1"
bertopic = "^0.16.0"
umap-learn = "^0.5.6"
hdbscan = "^0.8.33"
networkx = "^3.3"
igraph = "^0.11.4"
uunet = "^2.1.1"
qdrant-client = "^1.8.2"
openai = "^1.17.0"
python-dotenv = "^1.0.1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
jupyter = "^1.0.0"

[tool.poetry.scripts]
topiclayers = "topiclayers.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
