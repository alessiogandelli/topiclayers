input:
  format: twitter_jsonl
  posts: synth_llm.jsonl

name: synth_llm_overgranular

topic_model:
  embedder: all-MiniLM-L6-v2
  min_topic_size: 15
  # keep HDBSCAN's natural clusters with no reduction -> very many micro-topics
  nr_topics: null
  random_state: 42
  repro_mode: strict
  label_model: ''
  label_context: social media posts discussing climate change policy, energy and environmental politics

network:
  type: retweet

cache_dir: cache
output_dir: out_overgranular
